services:
  astrbot:
    image: soulter/astrbot:latest
    container_name: astrbot
    restart: always
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "6185:6185"   # WebUI
      - "6199:6199"   # OneBot v11 反向 WebSocket
    volumes:
      - ./astrbot_data:/AstrBot/data
    networks:
      - botnet

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    environment:
      - NAPCAT_GID=0
      - NAPCAT_UID=0
      - ACCOUNT=1955291327
      - TZ=Asia/Shanghai
      # 缓解 QQ 原生崩溃/Worker 退出循环，减少日志刷屏
      - NAPCAT_DISABLE_MULTI_PROCESS=1
    ports:
      - "6099:6099"   # NapCat WebUI
    volumes:
      - ./napcat_data/QQ:/app/napcat/.config/QQ
      - ./napcat_data/config:/app/napcat/config
      # 关键：与 astrbot 共享插件数据目录（相同路径），
      # 解决解析器等插件下载的媒体文件跨容器发送失败的问题
      - ./astrbot_data/plugin_data:/AstrBot/data/plugin_data
    networks:
      - botnet

networks:
  botnet:
    driver: bridge
